name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip install ruff && ruff check src tests
      - name: Every example profile must classify
        run: for f in examples/act/*.yaml; do manifest act classify "$f" --json > /dev/null; done
      - name: Scan itself (must stay clean at likely_violation)
        run: manifest scan src --fail-on likely
